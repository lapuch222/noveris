<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ANHANGÁ</title>
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Sora:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#04090d;--sf:#0a1720;--sf2:#0f2330;--ln:#1b3b4a;--tx:#e8f7fb;--mu:#8fb0bb;--ac:#5fd4ec;--ok:#6fe3b0;--er:#ff7a85;--fs:16px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
:root{--warn:#ffd166;--s1:#5fd4ec;--s2:#6fe3b0;--s3:#ffd166;--s4:#ff7a85}
/* Paletas por tipo de daltonismo: o fundo é o mesmo; mudam destaque, estados e cores dos gráficos.
   Protan/Deutan (vermelho-verde): eixo azul x amarelo. Tritan (azul-amarelo): eixo vermelho x verde, diferenciado também por claridade. */
/* Uma paleta própria para cada tipo. Cores conferidas por simulação de daltonismo (diferença de cor entre as séries e entre "bom" e "alerta").
   Protan/Deutan: eixo azul x amarelo/laranja. Tritan: eixo vermelho x verde, separado também por claridade. Cada paleta muda também o tom dos cartões. */
:root[data-daltonismo="protanopia"]{--ac:#5aa9ff;--ok:#5aa9ff;--er:#ffd23f;--warn:#ffffff;--s1:#5aa9ff;--s2:#ffd23f;--s3:#ff8c42;--s4:#ffffff;--ln:#1d3f66;--sf2:#0f2238}
:root[data-daltonismo="deuteranopia"]{--ac:#e69f00;--ok:#56b4e9;--er:#e69f00;--warn:#f0e442;--s1:#56b4e9;--s2:#e69f00;--s3:#cc79a7;--s4:#f5f5f5;--ln:#4a3a1a;--sf2:#231c10}
:root[data-daltonismo="protanomalia"]{--ac:#f0e442;--ok:#4da3ff;--er:#f0e442;--warn:#ffffff;--s1:#f0e442;--s2:#4da3ff;--s3:#ff9ecb;--s4:#e8e8e8;--ln:#4a4516;--sf2:#221f0c}
:root[data-daltonismo="deuteranomalia"]{--ac:#f08fc0;--ok:#56b4e9;--er:#f0e442;--warn:#ffffff;--s1:#f08fc0;--s2:#56b4e9;--s3:#f0e442;--s4:#ffffff;--ln:#4a2a40;--sf2:#25141f}
:root[data-daltonismo="tritanopia"]{--ac:#ff7a6b;--ok:#3ddc97;--er:#ff5c7a;--warn:#f5f5f5;--s1:#ff6b6b;--s2:#3ddc97;--s3:#f5f5f5;--s4:#ff9ecb;--ln:#4d2626;--sf2:#261212}
:root[data-daltonismo="tritanomalia"]{--ac:#6fe36f;--ok:#6fe36f;--er:#ff6b8a;--warn:#ffffff;--s1:#6fe36f;--s2:#ff6b8a;--s3:#ffffff;--s4:#ffa94d;--ln:#1f4a2a;--sf2:#10251a}
/* Acromatopsia: só tons de cinza separados por claridade (e por textura/rótulo nos gráficos); brilho reduzido e sem animações de brilho */
:root[data-daltonismo="acromatopsia"]{--tx:#e6e6e6;--mu:#a8a8a8;--ac:#ffffff;--ok:#ffffff;--er:#a6a6a6;--warn:#d0d0d0;--s1:#ffffff;--s2:#c4c4c4;--s3:#8c8c8c;--s4:#606060;--ln:#454545;--sf:#0d0f10;--sf2:#181b1d}
:root[data-daltonismo="acromatopsia"] img{filter:grayscale(1) brightness(.9)}
:root[data-daltonismo="acromatopsia"] .dr{animation:none}
.sw{margin-top:8px}.sw span{flex:1 1 22%;padding:6px 4px;border-radius:8px;text-align:center;font-size:.72em;color:#021016;font-weight:600;border:1px solid var(--tx)}
/* Alto contraste: preto e branco; destaque da paleta é mantido quando houver daltonismo */
:root[data-c="hi"]{--bg:#000;--sf:#000;--sf2:#111;--ln:#fff;--tx:#fff;--mu:#fff}
:root[data-c="hi"][data-daltonismo=""],:root[data-c="hi"][data-daltonismo="nenhum"]{--ac:#ffff00;--ok:#00ff00;--er:#ff7070;--s1:#ffff00;--s2:#00ff00;--s3:#00ffff;--s4:#ff7070}
:root[data-c="hi"] .card,:root[data-c="hi"] input,:root[data-c="hi"] select,:root[data-c="hi"] button{border-width:2px}
:root[data-c="hi"] nav{background:#000;border-top:2px solid #fff}
:root[data-c="hi"] button.p{background:var(--ac);color:#000;border:2px solid #fff}
:root[data-c="hi"] input,:root[data-c="hi"] select{background:#000;color:#fff;border:2px solid #fff}
.ch{margin:0 0 8px}.ch figcaption{margin-bottom:6px}.ch figcaption b{display:block;font-family:Michroma,sans-serif;font-weight:400;font-size:.85em;color:var(--tx)}.ch .mu{display:block}
.gate #app{padding-bottom:24px}.hb{margin:10px 0}.hb .bar{height:14px;border-radius:4px;border:1px solid var(--tx);min-width:4px}.hax{display:flex;justify-content:space-between;font-size:.7em;color:var(--mu);border-top:1px solid var(--mu);margin-top:4px;padding-top:2px}
*,*:before,*:after{box-sizing:inherit}html,body{margin:0;background:var(--bg);color:var(--tx);font:var(--fs)/1.5 Sora,system-ui,sans-serif}
h1,h2,h3{font-family:Michroma,Sora,sans-serif;font-weight:400;margin:0 0 .6rem;letter-spacing:.02em}h2{font-size:1.05em}h3{font-size:.9em;color:var(--ac)}
#app{max-width:560px;margin:0 auto;padding:12px 16px calc(84px + env(safe-area-inset-bottom,0px))}
header{display:flex;align-items:center;gap:12px;padding:8px 0 14px}header img{width:46px;height:46px;border-radius:50%;object-fit:cover;object-position:50% 30%;border:1px solid var(--ln)}
header b{font-family:Michroma,sans-serif;letter-spacing:.18em;font-weight:400}header small{display:block;color:var(--mu);font-size:.72em}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:16px;margin-bottom:14px}
label{display:block;margin:10px 0 4px;color:var(--mu);font-size:.85em}
input,select{width:100%;min-height:44px;background:var(--sf2);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:8px 12px;font:inherit}
button{min-height:44px;border-radius:10px;border:1px solid var(--ac);background:transparent;color:var(--ac);padding:8px 16px;font:inherit;cursor:pointer}
button.p{background:var(--ac);color:#021016;font-weight:600}button:disabled{opacity:.5}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}
nav{position:fixed;left:0;right:0;bottom:0;background:#071118ee;border-top:1px solid var(--ln);display:flex;overflow-x:auto;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));backdrop-filter:blur(8px);z-index:5}
nav button{flex:0 0 auto;min-width:74px;border:0;color:var(--mu);font-size:.72em;display:flex;flex-direction:column;align-items:center;gap:2px}nav button span{font-size:1.4em}nav button[aria-current=true]{color:var(--ac)}
.msg{padding:10px 12px;border-radius:10px;margin:10px 0;font-size:.9em;border:1px solid}.msg.ok{color:var(--ok);border-color:var(--ok)}.msg.er{color:var(--er);border-color:var(--er)}.msg.in{color:var(--mu);border-color:var(--ln)}
.k{flex:1 1 40%;background:var(--sf2);border:1px solid var(--ln);border-radius:12px;padding:10px}.k b{display:block;font-family:Michroma,sans-serif;font-size:1.15em;color:var(--ac);font-weight:400}.k span{font-size:.75em;color:var(--mu)}
.big{font-family:Michroma,sans-serif;font-size:1.8em;color:var(--ac)}.mu{color:var(--mu);font-size:.88em}
.tag{display:inline-block;border:1px solid var(--ln);border-radius:99px;padding:1px 10px;font-size:.75em;color:var(--mu);margin-right:6px}
table{width:100%;border-collapse:collapse;font-size:.88em}td,th{padding:6px 4px;border-bottom:1px solid var(--ln);text-align:left}
#splash{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9;transition:opacity .9s;overflow:hidden;cursor:pointer}
#splash.off{opacity:0;pointer-events:none}
.lg{position:relative;width:min(86vw,420px);aspect-ratio:1}
.lg>img{width:100%;height:100%;display:block;animation:bfade 1s both}.en{position:absolute;inset:0;animation:bfade 1s .4s both}.pc{position:absolute}.ph{left:0;top:73.65%;width:45.8%;height:26.35%;transform-origin:56.8% 13.8%;animation:hw .9s .6s 6}.pf{left:57.83%;top:67.57%;width:25.3%;height:22.7%;transform-origin:49.5% 13%;animation:fw .9s .6s 6}
.dr{position:absolute;left:31.9%;top:15.55%;width:33.1%;height:59%;transform-origin:50% 100%;animation:bob 4.6s 1.4s ease-in-out infinite,glow 3.2s 1.4s ease-in-out infinite}
.dr img{position:absolute;inset:0;width:100%;height:100%}
.dh,.db{position:absolute;inset:0}
.dh{-webkit-mask-image:linear-gradient(#000 40%,transparent 50%);mask-image:linear-gradient(#000 40%,transparent 50%);transform-origin:70% 40%;animation:head 7s ease-in-out infinite}
.db{-webkit-mask-image:linear-gradient(transparent 30%,#000 40%);mask-image:linear-gradient(transparent 30%,#000 40%);transform-origin:50% 100%;animation:breath 4.6s ease-in-out infinite}
.ey{position:absolute;left:83.9%;top:34.9%;width:6%;aspect-ratio:1;transform:translate(-50%,-50%);background:radial-gradient(#fff 8%,#5fd4ec 30%,transparent 68%);animation:eye 3.4s ease-in-out infinite}
.ld{position:absolute;left:83.9%;top:34.9%;width:4.6%;aspect-ratio:1.5;transform:translate(-50%,-50%) scaleY(0);transform-origin:50% 0;border-radius:50%;background:radial-gradient(#d2e3e9 55%,#d2e3e900 78%);animation:blink 5.4s infinite}
.lg svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}.rg{opacity:0;animation:fin 1s 1.3s forwards}.wk{animation:wk 6.7s forwards}
.r1{transform-origin:49.6px 50.6px;animation:spin 14s linear infinite}.r2{transform-origin:49.6px 50.6px;animation:spin 22s linear infinite reverse}
.lg:after{content:"";-webkit-mask-image:linear-gradient(90deg,transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(90deg,transparent,#000 30%,#000 70%,transparent);position:absolute;left:12%;right:12%;height:18%;top:-20%;opacity:0;background:linear-gradient(transparent,#5fd4ec1c,transparent);animation:scan 3.6s 1.8s ease-in-out infinite}
.pt{position:absolute;bottom:-4vh;width:3px;height:3px;border-radius:50%;background:var(--ac);opacity:0;animation:up linear infinite}
.hint{position:absolute;bottom:calc(6vh + env(safe-area-inset-bottom,0px));color:var(--mu);font-size:.8em;opacity:0;animation:fin 1s 1.2s forwards}
@keyframes rev{from{clip-path:inset(100% 0 0 0);opacity:0;transform:scale(.94)}to{clip-path:inset(0);opacity:1;transform:none}}
@keyframes glow{50%{filter:drop-shadow(0 0 18px #5fd4ec88) brightness(1.12)}}
.u,.l{transform-origin:0 0;animation:uw .9s linear infinite}.l{animation-name:lw}
.s1{animation:scr 16s linear infinite}.s2{animation:scr 8s linear infinite}.mn{animation:mnin 1.8s 3.2s cubic-bezier(.2,.7,.2,1) both}.dw{animation:step 1s 4.4s ease-in-out both}.bd{animation:bb .45s ease-in-out infinite}
@keyframes uw{0%,100%{transform:rotate(-20deg)}60%{transform:rotate(20deg)}}
@keyframes lw{0%,55%,100%{transform:rotate(0)}80%{transform:rotate(38deg)}}
@keyframes scr{to{transform:translateX(-200px)}}@keyframes mnin{from{transform:translateX(70px)}}@keyframes step{to{transform:translateY(-1.5px)}}@keyframes bb{50%{transform:translateY(-1.6px)}}
@keyframes wk{0%{opacity:0}6%,76%{opacity:1}84%,100%{opacity:0}}
@keyframes hop{50%{transform:translateY(-.7%)}}@keyframes fw{25%{transform:rotate(-13deg)}75%{transform:rotate(13deg)}}@keyframes hw{25%{transform:rotate(13deg)}75%{transform:rotate(-13deg)}}
@keyframes bfade{from{opacity:0}}
@keyframes enter{0%{transform:translate(-95%,9%);opacity:0;filter:blur(5px)}8%{opacity:1}22%{transform:translate(-70%,4%)}34%{transform:translate(-52%,9%)}46%{transform:translate(-34%,3%)}58%{transform:translate(-18%,7%);filter:blur(1px)}74%{transform:translate(-6%,-7%) rotate(-1.2deg);filter:blur(0)}88%{transform:translate(0,-.5%)}94%{transform:translate(0,1.2%) scale(1.01,.985)}100%{transform:none}}
@keyframes bob{50%{transform:translateY(-.9%)}}
@keyframes breath{50%{transform:scale(1.006,1.012)}}
@keyframes head{35%{transform:rotate(-1.8deg) translateY(-.4%)}70%{transform:rotate(1.2deg)}}
@keyframes blink{0%,86%,92%,100%{transform:translate(-50%,-50%) scaleY(0)}88%,94%{transform:translate(-50%,-50%) scaleY(1)}}
@keyframes eye{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes fin{to{opacity:1}}@keyframes spin{to{transform:rotate(360deg)}}
@keyframes scan{0%{top:-20%;opacity:1}60%,100%{top:105%;opacity:1}}
@keyframes up{0%{transform:translateY(0);opacity:0}15%{opacity:.8}100%{transform:translateY(-105vh);opacity:0}}
@media (prefers-reduced-motion:reduce){#splash,#splash *{animation:none!important;transition:none}.wk{display:none}.pf,.ph{animation:none}.lg svg,.hint{opacity:1}}
</style></head><body>

const LS={g(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},s(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

async function perfilAuth(){const {data:{user},error}=await client().auth.getUser();if(error||!user){S.auth=null;S.user=null;return null;}S.auth=user;const {data,error:err}=await client().from("dim_usuario").select("*").eq("auth_user_id",user.id).maybeSingle();if(err)throw err;S.user=data?{...data,preferencias_acessibilidade:{daltonismo:data.tipo_daltonismo||data.daltonismo||"",contraste:"normal"}}:null;return S.user;}
async function login(email,password){const {error}=await client().auth.signInWithPassword({email,password});if(error)throw error;await perfilAuth();if(!S.user)throw new Error("Conta autenticada, mas nenhum perfil está vinculado em dim_usuario.");S.an=null;await carregarUltimaAnalise();applyAcc();go("dash");}
async function cadastrar(nome,email,password){
 const nomeLimpo=nome.trim();
 if(nomeLimpo.length<2)throw new Error("Informe seu nome (pelo menos 2 caracteres).");
 if(password.length<6)throw new Error("A senha deve ter pelo menos 6 caracteres.");
 const {data,error}=await client().auth.signUp({email:email.trim(),password,options:{data:{nome:nomeLimpo}}});
 if(error)throw error;
 if(!data.session){return "Cadastro solicitado! Confirme seu e-mail pelo link enviado e depois selecione 'Já tenho conta' para entrar.";}
 await perfilAuth();
 if(!S.user){return "Conta criada. O perfil ainda não foi encontrado. Verifique o gatilho SQL de cadastro no Supabase e entre novamente.";}
 await carregarUltimaAnalise();applyAcc();go("dash");return "Conta criada com sucesso!";
}
async function sair(){await client().auth.signOut();S.user=null;S.auth=null;S.an=null;S.sess=null;S.res=null;applyAcc();go("perfil");}
async function carregarUltimaAnalise(){if(!S.user)return;const {data,error}=await client().from("fato_ia").select("*").eq("id_usuario",S.user.id_usuario).order("id_fato",{ascending:false}).limit(1);if(error)throw error;if(data?.length){S.an={id:data[0].id_fato,sessao:data[0],saved:data[0]};}}
const fld=(k,l,t,x)=>t=="b"?`<label>${l}<select data-k="${k}" data-t="b"><option value="">Não informar</option><option value="1">Sim</option><option value="0">Não</option></select></label>`:`<label>${l}<input data-k="${k}" data-t="${t}" ${t=="n"?'type="number" '+(x||'step="any"'):'type="text" maxlength="100"'}></label>`;
const coletar=()=>{const b={};document.querySelectorAll("[data-k]").forEach(e=>{const v=e.value.trim();if(v==="")return;b[e.dataset.k]=e.dataset.t=="b"?v=="1":e.dataset.t=="n"?+v:v});return b};
const syncD=p=>{if(p&&("tipo_daltonismo" in p||"daltonismo" in p)&&S.user){S.user.preferencias_acessibilidade=Object.assign({},S.user.preferencias_acessibilidade,{daltonismo:p.tipo_daltonismo||p.daltonismo||""});LS.s("user",S.user);applyAcc()}};
const preencher=p=>{syncD(p);fill(p)};const DD={Nenhum:"Visão de cores típica.",Protanopia:"Dicromatismo: ausência de cones sensíveis ao vermelho. O vermelho aparece como marrom, bege ou cinza.",Protanomalia:"Tricromatismo anômalo: cones vermelhos alterados; o vermelho se desloca em direção ao verde.",Deuteranopia:"Dicromatismo: ausência de cones sensíveis ao verde. O verde é confundido com marrom ou cinza.",Deuteranomalia:"Tricromatismo anômalo, o tipo mais comum: cones verdes alterados dificultam separar verde, vermelho e marrom.",Tritanopia:"Dicromatismo: ausência de cones sensíveis ao azul. Azul e verde, e amarelo e rosa, se confundem.",Tritanomalia:"Tricromatismo anômalo: cones azuis com funcionamento reduzido; menor percepção de tons azulados.",Acromatopsia:"Monocromatismo: só se veem preto, branco e cinza, em geral com sensibilidade à luz. A paleta usa só tons de cinza e reduz o brilho."};
const fill=p=>{document.querySelectorAll("[data-k]").forEach(e=>{const v=p[e.dataset.k];e.value=v==null?"":e.dataset.t=="b"?(v?"1":"0"):v});const e=$("#dd"),d=$("#daltonismo");if(e&&d)e.textContent=DD[d.value]||""};
// Consultas autenticadas: as políticas RLS limitam os registros acessíveis.
async function consulta(q){const {data,error}=await q;if(error)throw error;return data||[];}
const API={
 health:async()=>{const {data:{session}}=await client().auth.getSession();return {autenticado:!!session}},
 getPref:async()=>({preferencias:await consulta(client().from("dim_usuario").select("*").eq("auth_user_id",S.auth.id).single())}),
 salvarPref:async()=>{throw new Error("Edição desabilitada até configurar as políticas UPDATE.")},
 criarUsuario:async()=>{throw new Error("Cadastro de perfil desabilitado nesta etapa.")},
 criarSessao:async()=>{throw new Error("Registro de sessões desabilitado até configurar INSERT.")},
 analisar:async()=>{throw new Error("Análise de novas sessões ainda não habilitada.")},
 analiseSalva:async id=>consulta(client().from("fato_ia").select("*").eq("id_fato",id).single()),
 sessoes:async id=>({sessoes:await consulta(client().from("fato_ia").select("*").eq("id_usuario",id).order("id_fato",{ascending:false}))}),
 resumo:async()=>{const l=(await API.sessoes(S.user.id_usuario)).sessoes;
 const dur=x=>{const v=x.duracao_minutos;return v===null||v===undefined||v===""?null:(Number.isFinite(Number(v))?Number(v):null)};
 const validas=l.map(dur).filter(v=>v!==null);
 const total=validas.reduce((a,v)=>a+v,0);
 const resumo={total_sessoes:l.length,total_usuarios:l.length?1:0,total_minutos:total,duracao_media:validas.length?+(total/validas.length).toFixed(2):null,total_pausas:l.reduce((a,x)=>a+Number(x.quantidade_pausas||0),0),total_analises:l.filter(x=>x.classificacao!=null&&String(x.classificacao).trim()!=="").length};
 const porDia=new Map(),porClasse=new Map();
 for(const x of l){
  const d=String(x.inicio||"").slice(0,10);
  if(d){const r=porDia.get(d)||{data:d,total_sessoes:0,total_minutos:0,total_pausas:0,sessoes_com_duracao:0};r.total_sessoes++;const minutos=dur(x);if(minutos!==null){r.total_minutos+=minutos;r.sessoes_com_duracao++}r.total_pausas+=Number(x.quantidade_pausas||0);porDia.set(d,r)}
  const classe=String(x.classificacao??"").trim();if(classe)porClasse.set(classe,(porClasse.get(classe)||0)+1);
 }
 const evolucao_diaria=[...porDia.values()].sort((a,b)=>a.data.localeCompare(b.data)).map(r=>({...r,duracao_media:r.sessoes_com_duracao?+(r.total_minutos/r.sessoes_com_duracao).toFixed(2):null}));
 const distribuicao_classificacao=[...porClasse.entries()].map(([classificacao,quantidade])=>({classificacao,quantidade})).sort((a,b)=>b.quantidade-a.quantidade);
 return {resumo,evolucao_diaria,distribuicao_classificacao};},
 analises:async id=>({analises:(await API.sessoes(id)).sessoes.filter(x=>x.classificacao!=null)})
};

const nice=m=>{const e=Math.pow(10,Math.floor(Math.log10(m||1))),f=m/e;return(f<=1?1:f<=2?2:f<=5?5:10)*e};
const ticks=(mx,n=4)=>{const st=nice((mx||1)/n),top=Math.ceil((mx||1)/st)*st;return Array.from({length:Math.round(top/st)+1},(_,i)=>+(i*st).toFixed(2))};
const dd=s=>/^\d{4}-\d\d-\d\d/.test(s)?s.slice(8,10)+"/"+s.slice(5,7):s;
function chart({k,title,sub,data,xT,yT,unit,limit}){
 if(!data.length)return `<figure class="ch"><figcaption><b>${title}</b></figcaption>${msg("Sem dados para mostrar neste período.","in")}</figure>`;
 const W=340,H=240,L=48,R=12,T=16,B=56,pw=W-L-R,ph=H-T-B,mx=Math.max(...data.map(d=>d.v),limit||0,1),tk=ticks(mx),top=tk[tk.length-1],n=data.length,bw=pw/n,every=Math.ceil(n/7);
 const X=i=>L+(k=="bar"?bw*(i+.5):n>1?pw*i/(n-1):pw/2),Y=v=>T+ph-v/top*ph,txt=(x,y,t,a="middle",ex="")=>`<text x="${x}" y="${y}" text-anchor="${a}" font-size="9.5" fill="var(--mu)" ${ex}>${esc(t)}</text>`;
 let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}. Eixo vertical: ${esc(yT)}. Eixo horizontal: ${esc(xT)}." style="width:100%;height:auto">`;
 s+=tk.map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--ln)" stroke-width=".7"/>${txt(L-6,Y(v)+3.5,v,"end")}`).join("");
 s+=`<line x1="${L}" x2="${L}" y1="${T}" y2="${T+ph}" stroke="var(--mu)"/><line x1="${L}" x2="${W-R}" y1="${T+ph}" y2="${T+ph}" stroke="var(--mu)"/>`;
 if(k=="bar")s+=data.map((d,i)=>`<rect x="${X(i)-Math.max(2,bw*.32)}" y="${Y(d.v)}" width="${Math.max(4,bw*.64)}" height="${Math.max(1,T+ph-Y(d.v))}" rx="2" fill="var(--s1)" stroke="var(--tx)" stroke-width=".6"><title>${esc(d.l)}: ${fmt(d.v)} ${unit||""}</title></rect>`).join("");
 else s+=`<polyline points="${data.map((d,i)=>X(i)+","+Y(d.v)).join(" ")}" fill="none" stroke="var(--s1)" stroke-width="2.5"/>`+data.map((d,i)=>`<circle cx="${X(i)}" cy="${Y(d.v)}" r="3.5" fill="var(--s1)" stroke="var(--bg)" stroke-width="1.2"><title>${esc(d.l)}: ${fmt(d.v)} ${unit||""}</title></circle>`).join("");
 if(n<=12)s+=data.map((d,i)=>txt(X(i),Y(d.v)-6,fmt(d.v),"middle",'font-weight="600" style="fill:var(--tx)"')).join("");
 if(limit)s+=`<line x1="${L}" x2="${W-R}" y1="${Y(limit)}" y2="${Y(limit)}" stroke="var(--warn)" stroke-width="1.6" stroke-dasharray="6 4"/>${txt(W-R,Y(limit)-4,"Seu limite: "+limit+" "+(unit||""),"end",'style="fill:var(--warn);paint-order:stroke;stroke:var(--sf);stroke-width:3px" font-weight="600"')}`;
 s+=data.map((d,i)=>i%every==0?txt(X(i),T+ph+14,d.l):"").join("");
 s+=txt(L+pw/2,H-8,xT)+txt(12,T+ph/2,yT,"middle",`transform="rotate(-90 12 ${T+ph/2})"`)+"</svg>";
 return `<figure class="ch"><figcaption><b>${title}</b>${sub?`<span class="mu">${sub}</span>`:""}</figcaption>${s}</figure>`}
const PAT=["","repeating-linear-gradient(45deg,#000a 0 3px,transparent 3px 7px)","radial-gradient(#000b 1.6px,transparent 2.2px) 0 0/7px 7px","repeating-linear-gradient(90deg,#000a 0 3px,transparent 3px 7px)"];
function hbar(title,sub,data,xT){if(!data.length)return `<figure class="ch"><figcaption><b>${title}</b></figcaption>${msg("Nenhuma classificação ainda.","in")}</figure>`;const tot=data.reduce((a,x)=>a+x.v,0),tk=ticks(Math.max(...data.map(x=>x.v))),mx=tk[tk.length-1];
 return `<figure class="ch"><figcaption><b>${title}</b><span class="mu">${sub}</span></figcaption>${data.map((x,i)=>`<div class="hb" role="img" aria-label="${esc(x.l)}: ${x.v} sessões, ${Math.round(x.v/tot*100)}%"><div style="font-size:.85em"><b>${esc(x.l)}</b> — ${x.v} (${Math.round(x.v/tot*100)}%)</div><div class="bar" style="width:${x.v/mx*100}%;background:var(--s${i%4+1});background-image:${PAT[i%4]||"none"}"></div></div>`)}<div class="hax">${tk.map(v=>`<span>${v}</span>`)}</div><div class="mu" style="text-align:center">${xT}</div></figure>`}
function histChart(l,lim){const d=l.filter(s=>s.duracao_minutos!=null).slice(0,14).reverse().map(s=>({l:dd(String(s.inicio||"").slice(0,10)),v:Math.round(Number(s.duracao_minutos)*10)/10}));const pk=d.length?d.reduce((a,x)=>x.v>a.v?x:a):null;return chart({k:"bar",title:"Duração das últimas sessões",sub:d.length?`Sessão mais longa: ${pk.v} min em ${pk.l}.`+(lim?` A linha tracejada é o limite que você escolheu.`:""):"",data:d,xT:"Data da sessão (dia/mês)",yT:"Duração (minutos)",unit:"min",limit:lim||null})}
function geralHtml(){const r=S.res;if(!r)return"";const rs=r.resumo||{},n=+$("#per").value,lim=n?new Date(Date.now()-n*864e5).toISOString().slice(0,10):"",ev=(r.evolucao_diaria||[]).filter(x=>!lim||String(x.data)>=lim).map(x=>({l:dd(String(x.data)),s:Number(x.total_sessoes),m:x.duracao_media==null?null:Number(x.duracao_media)})),cl=(r.distribuicao_classificacao||[]).map(x=>({l:x.classificacao,v:Number(x.quantidade)}));

 return `<div class="row" style="margin-bottom:14px">${K.map(([l,v])=>`<div class="k"><b>${esc(fmt(v))}</b><span>${l}</span></div>`)}</div><p class="mu">Os totais acima são das suas sessões em todo o período. O filtro afeta apenas os gráficos e a tabela.</p>

 <div class="card">${chart({k:"line",title:"Duração média por dia",sub:"Quanto tempo, em média, cada sessão durou naquele dia.",data:ev.filter(x=>x.m!=null).map(x=>({l:x.l,v:Math.round(x.m*10)/10})),xT:"Dia (dia/mês)",yT:"Duração média (minutos)",unit:"min"})}</div>
 <div class="card">${hbar("Classificação das sessões","Cada barra tem nome, quantidade e porcentagem, além de cor e textura.",cl,"Quantidade de sessões")}</div>
